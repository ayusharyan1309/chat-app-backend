databaseChangeLog:
  - changeSet:
      id: 1
      author: saas-platform
      changes:
        - createTable:
            tableName: saas_tenants
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_identifier
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: tenant_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: display_name
                  type: VARCHAR(255)
              - column:
                  name: domain
                  type: VARCHAR(255)
              - column:
                  name: contact_email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: contact_phone
                  type: VARCHAR(50)
              - column:
                  name: logo_url
                  type: VARCHAR(500)
              - column:
                  name: primary_color
                  type: VARCHAR(7)
              - column:
                  name: secondary_color
                  type: VARCHAR(7)
              - column:
                  name: database_type
                  type: VARCHAR(20)
              - column:
                  name: db_host
                  type: VARCHAR(255)
              - column:
                  name: db_port
                  type: INTEGER
              - column:
                  name: db_name
                  type: VARCHAR(100)
              - column:
                  name: db_username
                  type: VARCHAR(100)
              - column:
                  name: db_password
                  type: VARCHAR(255)
              - column:
                  name: max_users
                  type: INTEGER
                  defaultValueNumeric: 100
              - column:
                  name: max_storage_gb
                  type: INTEGER
                  defaultValueNumeric: 10
              - column:
                  name: max_messages_per_day
                  type: BIGINT
                  defaultValueNumeric: 10000
              - column:
                  name: plan_type
                  type: VARCHAR(20)
                  defaultValue: FREE
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: ACTIVE
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
              - column:
                  name: trial_ends_at
                  type: TIMESTAMP
              - column:
                  name: suspended_at
                  type: TIMESTAMP

  - changeSet:
      id: 2
      author: saas-platform
      changes:
        - createTable:
            tableName: saas_tenant_settings
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: setting_key
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: setting_value
                  type: TEXT
              - column:
                  name: setting_type
                  type: VARCHAR(20)
                  defaultValue: STRING
              - column:
                  name: description
                  type: VARCHAR(500)
              - column:
                  name: is_encrypted
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: saas_tenant_settings
            baseColumnNames: tenant_id
            referencedTableName: saas_tenants
            referencedColumnNames: id
            constraintName: fk_tenant_settings_tenant

  - changeSet:
      id: 3
      author: saas-platform
      changes:
        - createTable:
            tableName: saas_tenant_features
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: feature_id
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: is_enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
              - column:
                  name: feature_config
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: saas_tenant_features
            baseColumnNames: tenant_id
            referencedTableName: saas_tenants
            referencedColumnNames: id
            constraintName: fk_tenant_features_tenant
        - addUniqueConstraint:
            tableName: saas_tenant_features
            columnNames: tenant_id, feature_id
            constraintName: uk_tenant_feature

  - changeSet:
      id: 4
      author: saas-platform
      changes:
        - createTable:
            tableName: saas_subscription_plans
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: plan_name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: display_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: price_monthly
                  type: DECIMAL(10,2)
              - column:
                  name: price_yearly
                  type: DECIMAL(10,2)
              - column:
                  name: currency
                  type: VARCHAR(3)
                  defaultValue: USD
              - column:
                  name: max_users
                  type: INTEGER
                  defaultValueNumeric: 100
              - column:
                  name: max_storage_gb
                  type: INTEGER
                  defaultValueNumeric: 10
              - column:
                  name: max_messages_per_day
                  type: BIGINT
                  defaultValueNumeric: 10000
              - column:
                  name: max_concurrent_connections
                  type: INTEGER
                  defaultValueNumeric: 50
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
              - column:
                  name: is_trial_plan
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: trial_duration_days
                  type: INTEGER
                  defaultValueNumeric: 14
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP

  - changeSet:
      id: 5
      author: saas-platform
      changes:
        - createTable:
            tableName: saas_plan_features
            columns:
              - column:
                  name: plan_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: feature_id
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: saas_plan_features
            baseColumnNames: plan_id
            referencedTableName: saas_subscription_plans
            referencedColumnNames: id
            constraintName: fk_plan_features_plan

  - changeSet:
      id: 6
      author: saas-platform
      changes:
        - createTable:
            tableName: saas_tenant_subscriptions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: plan_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: ACTIVE
              - column:
                  name: billing_cycle
                  type: VARCHAR(20)
                  defaultValue: MONTHLY
              - column:
                  name: amount
                  type: DECIMAL(10,2)
              - column:
                  name: currency
                  type: VARCHAR(3)
                  defaultValue: USD
              - column:
                  name: start_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: TIMESTAMP
              - column:
                  name: next_billing_date
                  type: TIMESTAMP
              - column:
                  name: cancelled_at
                  type: TIMESTAMP
              - column:
                  name: is_trial
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: trial_ends_at
                  type: TIMESTAMP
              - column:
                  name: current_users
                  type: INTEGER
                  defaultValueNumeric: 0
              - column:
                  name: current_storage_gb
                  type: DECIMAL(10,2)
                  defaultValueNumeric: 0
              - column:
                  name: messages_today
                  type: BIGINT
                  defaultValueNumeric: 0
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: saas_tenant_subscriptions
            baseColumnNames: tenant_id
            referencedTableName: saas_tenants
            referencedColumnNames: id
            constraintName: fk_subscription_tenant
        - addForeignKeyConstraint:
            baseTableName: saas_tenant_subscriptions
            baseColumnNames: plan_id
            referencedTableName: saas_subscription_plans
            referencedColumnNames: id
            constraintName: fk_subscription_plan

  - changeSet:
      id: 7
      author: saas-platform
      changes:
        - createTable:
            tableName: saas_admin_users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: full_name
                  type: VARCHAR(255)
              - column:
                  name: role
                  type: VARCHAR(20)
                  defaultValue: ADMIN
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
              - column:
                  name: last_login
                  type: TIMESTAMP
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP

