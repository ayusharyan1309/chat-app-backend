# =====================================================================================
# Chat Platform — bootstrap configuration
#
# Everything here can be overridden with environment variables. Connector settings below
# are only the *defaults*: operators can switch providers at runtime from the dashboard
# (Infrastructure page), and those choices are stored in the control-plane database.
# =====================================================================================

spring:
  application:
    name: chat-platform

  # Control-plane database (tenants, plans, configs, API keys, audit). H2 file by default;
  # use PostgreSQL or MySQL in production.
  datasource:
    url: ${CONTROL_DB_URL:jdbc:h2:file:./data/control-plane;AUTO_SERVER=FALSE}
    username: ${CONTROL_DB_USERNAME:sa}
    password: ${CONTROL_DB_PASSWORD:}
    hikari:
      pool-name: control-plane
      maximum-pool-size: ${CONTROL_DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:100MB}
      max-request-size: ${MAX_UPLOAD_SIZE:100MB}

  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
  # X-Forwarded-* is honoured only from internal proxies (Tomcat RemoteIpValve defaults: private and
  # loopback ranges). Set server.tomcat.remoteip.internal-proxies to match your load balancers.
  forward-headers-strategy: native

platform:
  node-id: ${NODE_ID:}
  public-url: ${PUBLIC_URL:http://localhost:8080}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
  config-poll-interval: ${CONFIG_POLL_INTERVAL:5s}

  security:
    # 32+ random characters. Encrypts connector secrets at rest; purpose-specific keys for media URL
    # signing (and JWTs, when jwt-secret is blank) are derived from it. Never change it in place.
    master-key: ${PLATFORM_MASTER_KEY:}
    # Signs admin and user JWTs (derived from the master key when blank).
    jwt-secret: ${PLATFORM_JWT_SECRET:}
    # Let tenants register webhooks/JWKS on private networks (development only).
    allow-private-network-callbacks: ${PLATFORM_SECURITY_ALLOW_PRIVATE_NETWORK_CALLBACKS:false}
    admin-token-ttl: 12h
    user-token-ttl: 24h
    # Bounds for every end-user token (server API, logins); impersonation tokens from the dashboard.
    min-user-token-ttl: 5m
    max-user-token-ttl: 30d
    impersonation-token-ttl: 8h
    bootstrap-admin:
      email: ${ADMIN_EMAIL:admin@local}
      password: ${ADMIN_PASSWORD:admin12345}
      name: Platform Owner

  # Dashboard brute-force protection (counted in the shared cache, so cluster-wide).
  admin-login:
    max-failures-per-account-and-ip: 10
    max-failures-per-account: 50
    failure-window: 15m

  bus:
    topic-prefix: ${BUS_TOPIC_PREFIX:}

  # ---------------------------------------------------------------------------------
  # Tuning. The values below are the built-in defaults, listed so they are discoverable.
  # ---------------------------------------------------------------------------------
  realtime:
    inbound-threads: 32
    outbound-threads: 16
    max-frame-size: 128KB
    send-buffer-size: 1MB
    send-time-limit: 20s
    heartbeat: 20s
  presence:
    ttl: 60s
    heartbeat: 20s
    max-watched-users: 500
  cluster:
    node-ttl: 30s
    heartbeat: 10s
    slot-window: 256
  connector-runtime:
    retire-grace: 30s
    tenant-failure-backoff: 5s
  # Node-local cache lifetimes: upper bounds on staleness if a cluster invalidation is missed.
  caches:
    tenant-snapshot: 15s
    user-status: 30s
    membership: 10s
    conversation: 30s
    blocks: 10s
    api-keys: 30s
    admin-roles: 15s
    webhook-targets: 30s
  locks:
    lease: 10s
    max-wait: 3s
  webhooks:
    max-attempts: 5
    initial-backoff: 10s
    request-timeout: 10s
    delivery-retention: 14d
  metering:
    usage-flush-interval: 30s
    metrics-flush-interval: 5s
    metrics-retention: 25h
  jwks:
    cache-ttl: 1h
    min-refresh-interval: 60s
    fetch-timeout: 5s

  # Default connectors. provider = one of the ids listed on the dashboard's Infrastructure page.
  connectors:
    message-store:
      provider: ${MESSAGE_STORE_PROVIDER:h2}
      settings:
        url: ${MESSAGE_STORE_URL:jdbc:h2:file:./data/chat-store}
        username: ${MESSAGE_STORE_USERNAME:sa}
        password: ${MESSAGE_STORE_PASSWORD:}
    cache:
      provider: ${CACHE_PROVIDER:memory}
      settings:
        uri: ${REDIS_URL:redis://localhost:6379}
    event-bus:
      provider: ${EVENT_BUS_PROVIDER:memory}
      settings:
        "[bootstrapServers]": ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        uri: ${REDIS_URL:redis://localhost:6379}
    blob-store:
      provider: ${BLOB_STORE_PROVIDER:local}
      settings:
        directory: ${MEDIA_DIRECTORY:./data/media}
        bucket: ${S3_BUCKET:}
        region: ${S3_REGION:us-east-1}
        endpoint: ${S3_ENDPOINT:}
    push:
      provider: ${PUSH_PROVIDER:none}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: chat-platform

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.ayush.chat: INFO
    org.apache.kafka: WARN
    com.datastax.oss.driver: WARN
    org.mongodb.driver: WARN
    org.hibernate.orm.incubating: ERROR
