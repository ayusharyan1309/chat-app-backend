spring:
  application:
    name: chat-saas
  
  # Master Database Configuration
  datasource:
    master:
      url: jdbc:mysql://${DB_MASTER_HOST:localhost}:${DB_MASTER_PORT:3306}/${DB_MASTER_NAME:chat_saas_master}
      username: ${DB_MASTER_USERNAME:root}
      password: ${DB_MASTER_PASSWORD:}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        pool-name: master-pool
        maximum-pool-size: 20
        minimum-idle: 5
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
  
  jpa:
    hibernate:
      dialect: org.hibernate.dialect.MySQLDialect
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        format_sql: true
        show_sql: false
        use_sql_comments: true
    open-in-view: false
  
  # Liquibase
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: chat_saas
  
  # Redis (Optional)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 6000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  
  # Jackson
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# Server
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

# Management
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

# SaaS Configuration
saas:
  multi-tenant:
    enabled: true
    tenant-resolver: header  # header, domain, jwt
    default-plan: free
    header-name: X-Tenant-ID
  
  subscription:
    trial-days: 14
    require-payment: false
    default-plan: free
  
  features:
    enabled: true
    cache-ttl: 300
    default-features:
      - core-chat
      - user-management
      - kafka-integration

# Security
security:
  jwt:
    secret: ${JWT_SECRET:your-secret-key-must-be-at-least-256-bits-long-for-HS256}
    expiration: 86400000  # 24 hours
  
  firebase:
    enabled: ${FIREBASE_ENABLED:false}
    config-path: ${FIREBASE_CONFIG_PATH:firebase-service-account.json}

# Kafka
spring.kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  producer:
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  consumer:
    group-id: chat-saas
    auto-offset-reset: earliest
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    properties:
      spring.json.trusted.packages: "*"

# Logging
logging:
  level:
    root: INFO
    com.ayush.chat: DEBUG
    org.hibernate.SQL: WARN
  pattern:
    dateformat: yyyy-MM-dd HH:mm:ss.SSS

# CORS
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  
  datasource:
    master:
      url: jdbc:h2:mem:chat_saas_master
      driver-class-name: org.h2.Driver
  
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.ayush.chat: DEBUG

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  
  datasource:
    master:
      url: jdbc:mysql://${DB_MASTER_HOST}:${DB_MASTER_PORT}/${DB_MASTER_NAME}
      hikari:
        maximum-pool-size: 50
        minimum-idle: 10

logging:
  level:
    root: WARN
    com.ayush.chat: INFO
