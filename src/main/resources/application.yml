spring:
  application:
    name: chat-saas
  
  # Master Database Configuration
  datasource:
    master:
      url: jdbc:mysql://${DB_MASTER_HOST:localhost}:${DB_MASTER_PORT:3306}/${DB_MASTER_NAME:chat_saas_master}
      username: ${DB_MASTER_USERNAME:root}
      password: ${DB_MASTER_PASSWORD:}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        pool-name: master-pool
        maximum-pool-size: 20
        minimum-idle: 5
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
  
  jpa:
    hibernate:
      dialect: org.hibernate.dialect.MySQLDialect
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        format_sql: true
        show_sql: false
        use_sql_comments: true
    open-in-view: false
  
  # Liquibase
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: chat_saas
  
  # Redis (Optional)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 6000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  
  # Jackson
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# Server
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

# Management
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

# SaaS Configuration
saas:
  multi-tenant:
    enabled: true
    tenant-resolver: header  # header, domain, jwt
    default-plan: free
    header-name: X-Tenant-ID
  
  subscription:
    trial-days: 14
    require-payment: false
    default-plan: free
  
  features:
    enabled: true
    cache-ttl: 300
    default-features:
      - core-chat
      - user-management
      - kafka-integration

# Security
security:
  jwt:
    secret: ${JWT_SECRET:your-secret-key-must-be-at-least-256-bits-long-for-HS256}
    expiration: 86400000  # 24 hours
  
  firebase:
    enabled: ${FIREBASE_ENABLED:false}
    config-path: ${FIREBASE_CONFIG_PATH:firebase-service-account.json}

# Kafka
spring.kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  producer:
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  consumer:
    group-id: chat-saas
    auto-offset-reset: earliest
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    properties:
      spring.json.trusted.packages: "*"

# Logging
logging:
  level:
    root: INFO
    com.ayush.chat: DEBUG
    org.hibernate.SQL: WARN
  pattern:
    dateformat: yyyy-MM-dd HH:mm:ss.SSS

# CORS
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

# ============================================================
# CHAT STORAGE CONFIGURATION
# ============================================================
# Switch the storage backend by changing 'type' below.
# Supported: mysql, postgresql, mongodb, firebase, supabase, h2
# ============================================================
chat:
  storage:
    # The storage backend type for chat data
    # Change this single value to switch between databases!
    type: ${CHAT_STORAGE_TYPE:h2}  # mysql | postgresql | mongodb | firebase | supabase | h2
    
    # Prefix for all chat tables/collections (useful for multi-tenant isolation)
    collection-prefix: ${CHAT_STORAGE_PREFIX:chat_}
    
    # Enable audit logging for storage operations
    enable-audit: true
    
    # Retry attempts for failed operations
    retry-attempts: 3
    
    # Connection timeout in milliseconds
    connection-timeout: 30000
    
    # ----------------------------------------------------------
    # SQL Configuration (MySQL, PostgreSQL, H2)
    # ----------------------------------------------------------
    sql:
      url: ${CHAT_SQL_URL:jdbc:h2:mem:chat_storage}
      username: ${CHAT_SQL_USERNAME:sa}
      password: ${CHAT_SQL_PASSWORD:}
      driver-class-name: ${CHAT_SQL_DRIVER:org.h2.Driver}
      pool-size: ${CHAT_SQL_POOL_SIZE:20}
      min-idle: 5
      connection-timeout: 30000
    
    # ----------------------------------------------------------
    # MongoDB Configuration
    # ----------------------------------------------------------
    mongodb:
      # Full connection URI (overrides host/port/database)
      uri: ${CHAT_MONGO_URI:}
      # Individual connection settings (used if URI is not set)
      host: ${CHAT_MONGO_HOST:localhost}
      port: ${CHAT_MONGO_PORT:27017}
      database: ${CHAT_MONGO_DATABASE:chat_db}
      username: ${CHAT_MONGO_USERNAME:}
      password: ${CHAT_MONGO_PASSWORD:}
      auth-database: ${CHAT_MONGO_AUTH_DB:admin}
    
    # ----------------------------------------------------------
    # Firebase Firestore Configuration
    # ----------------------------------------------------------
    firebase:
      project-id: ${CHAT_FIREBASE_PROJECT_ID:}
      credential-path: ${CHAT_FIREBASE_CREDENTIAL_PATH:firebase-service-account.json}
      firestore-database: ${CHAT_FIREBASE_DB:(default)}
    
    # ----------------------------------------------------------
    # Supabase Configuration
    # ----------------------------------------------------------
    supabase:
      url: ${CHAT_SUPABASE_URL:}
      api-key: ${CHAT_SUPABASE_API_KEY:}
      anon-key: ${CHAT_SUPABASE_ANON_KEY:}
      schema: ${CHAT_SUPABASE_SCHEMA:public}

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  
  datasource:
    master:
      url: jdbc:h2:mem:chat_saas_master
      driver-class-name: org.h2.Driver
  
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.ayush.chat: DEBUG

---
# MongoDB Profile
# Use: --spring.profiles.active=dev,mongodb
# Or set: CHAT_STORAGE_TYPE=mongodb
spring:
  config:
    activate:
      on-profile: mongodb

# Automatically switches chat storage to MongoDB
chat:
  storage:
    type: mongodb
    mongodb:
      host: ${CHAT_MONGO_HOST:localhost}
      port: ${CHAT_MONGO_PORT:27017}
      database: ${CHAT_MONGO_DATABASE:chat_db}

---
# MySQL Profile
# Use: --spring.profiles.active=dev,mysql
spring:
  config:
    activate:
      on-profile: mysql

chat:
  storage:
    type: mysql
    sql:
      url: jdbc:mysql://${CHAT_MYSQL_HOST:localhost}:${CHAT_MYSQL_PORT:3306}/${CHAT_MYSQL_DB:chat_storage}
      username: ${CHAT_MYSQL_USERNAME:root}
      password: ${CHAT_MYSQL_PASSWORD:}
      driver-class-name: com.mysql.cj.jdbc.Driver

---
# PostgreSQL Profile
# Use: --spring.profiles.active=dev,postgresql
spring:
  config:
      activate:
          on-profile: postgresql

chat:
  storage:
    type: postgresql
    sql:
      url: jdbc:postgresql://${CHAT_PG_HOST:localhost}:${CHAT_PG_PORT:5432}/${CHAT_PG_DB:chat_storage}
      username: ${CHAT_PG_USERNAME:postgres}
      password: ${CHAT_PG_PASSWORD:}
      driver-class-name: org.postgresql.Driver

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  
  datasource:
    master:
      url: jdbc:mysql://${DB_MASTER_HOST}:${DB_MASTER_PORT}/${DB_MASTER_NAME}
      hikari:
        maximum-pool-size: 50
        minimum-idle: 10

logging:
  level:
    root: WARN
    com.ayush.chat: INFO
