name: CI

on:
  push:
    branches: [master, "feature/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (JDK 21, live PostgreSQL / MySQL / Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chat
          POSTGRES_PASSWORD: chat
          POSTGRES_DB: chat_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chat" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: chat
          MYSQL_DATABASE: chat_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pchat" --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/chat_test
      TEST_POSTGRES_USER: chat
      TEST_POSTGRES_PASSWORD: chat
      TEST_MYSQL_URL: jdbc:mysql://localhost:3306/chat_test
      TEST_MYSQL_USER: root
      TEST_MYSQL_PASSWORD: chat
      REDIS_URL: redis://localhost:6379
      # End-to-end scenarios (PlatformIT) on PostgreSQL + Redis instead of H2 + in-memory.
      IT_CONTROL_DB_URL: jdbc:postgresql://localhost:5432/chat_test
      IT_CONTROL_DB_USERNAME: chat
      IT_CONTROL_DB_PASSWORD: chat
      IT_STORE_PROVIDER: postgresql
      IT_STORE_URL: jdbc:postgresql://localhost:5432/chat_test
      IT_STORE_USERNAME: chat
      IT_STORE_PASSWORD: chat
      IT_STORE_TABLE_PREFIX: it_
      IT_CACHE_PROVIDER: redis
      IT_BUS_PROVIDER: redis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: ./mvnw -B -ntp verify
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports

  frontend:
    name: Console (lint, type-check, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: chat-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
